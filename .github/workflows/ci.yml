name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      S3_BUCKET: test-bucket
      ANTHROPIC_API_KEY: test
      GROQ_API_KEY: test
      OPENWEATHER_API_KEY: test
      GOOGLE_MAPS_API_KEY: test
      HOME_LOCATION: "Riverview, FL"
      WORK_LOCATION: "Tampa, FL"
      SCHOOL_LOCATION: "Riverview, FL"
      EMAIL_SENDER: test@example.com
      EMAIL_RECIPIENT: family@example.com
      GMAIL_APP_PASSWORD: test
      BRIEFING_TITLE: "Weekly Family Briefing"
      AGENT_TONE: "warm and practical"
      DAILY_ROUTINE: "School and family logistics"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
